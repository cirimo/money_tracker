name: CI

on:
  push:
  pull_request:

# A newer push to the same branch or pull request makes the older run pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Build, lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Also validates the checked-in Gradle wrapper jar against known checksums.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The same command developers run locally, see CLAUDE.md.
      # `check` covers Spotless, detekt, Android Lint, unit tests and compiling the instrumented tests.
      - name: Run all checks and build the debug APK
        run: ./gradlew check assembleDebug

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
